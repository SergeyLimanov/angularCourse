<div class="flex gap-3">
  <div class="flex-auto p-fluid">
    <p-inputNumber
      [(ngModel)]="duration"
      mode="decimal"
      [showButtons]="true"
      (ngModelChange)="onDurationChange($event)"
      inputId="minmax-buttons"
      [min]="0">
    </p-inputNumber></div>
  <div class="flex align-items-center justify-content-center" >  {{duration | duration}}</div>
</div>
