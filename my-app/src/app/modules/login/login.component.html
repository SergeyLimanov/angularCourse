<p-card header="Вход" class="login" [style]="{ width: '400px' }">
  <div class="p-fluid">
    <div>
      <div class="my-2">Email*</div>
      <input
        class="p-inputtext-lg"
        type="email"
        pInputText
        [(ngModel)]="login"
        placeholder="Например user@domain.com"
        required
      />
    </div>
    <div>
      <div class="my-2">Пароль*</div>
      <input
        class="p-inputtext-lg"
        type="password"
        pInputText
        [(ngModel)]="password"
        placeholder="Ваш пароль"
        required
      />
    </div>
  </div>
  <div class="forgot-password flex justify-content-between my-3">
    <a href="#" (click)="resetPassword()">Забыли пароль?</a>
    <div></div>
    <p-button label="Войти" styleClass="p-button-secondary p-button-lg"
              (click)="loginAuth()"
    ></p-button>
  </div>
</p-card>
